paths:
  ath_executable: ""
  gmsh_executable: "gmsh"
  working_directory: "."
  mesh_output_directory: "outputs/mesh"
  solver_output_directory: "outputs/solver"
  temp_directory: "outputs/tmp"
  logs_directory: "logs"
  outputs_directory: "outputs"

runtime:
  default_mode: "mock"
  timeout_seconds: 120
  frequencies_hz: [1000.0, 2000.0, 4000.0]
  coverage_half_angle_deg: 45.0
  coverage_target_path: "config/coverage_target.yaml"
  target_db: 0.0
  outside_target_db: -20.0
  spill_weight: 1.5
  beamwidth_db_down: 6.0
  min_efficiency_proxy_db: -6.0
  min_matching_proxy: 0.45
  min_energy_concentration: 0.65
  mfg_penalty_scale: 1.0
  smooth_boundary_band_deg: 8.0
  side_lobe_margin_db: 3.0
  smooth_transition_weight: 0.5
  smooth_boundary_weight: 0.3
  smooth_sidelobe_weight: 0.2
  default_bw_h_target_deg: 90.0
  default_bw_v_target_deg: 90.0
  objective_weights:
    w_in: 0.40
    w_out: 0.30
    w_bw: 0.15
    w_smooth: 0.05
    w_eff: 0.05
    w_mfg: 0.05
  alpha_frequency_weights: {}
  beta_frequency_weights: {}
  gamma_frequency_weights: {}
  solver_prefer_wsl: true
  wsl_python_executable: ".venv_wsl/bin/python"
  wsl_distro: ""
  wsl_solver_repeated_runs: 1
  ga_parameters_path: "config/geometry_params.yaml"
  full_population_size: 20
  full_generations: 20
  full_mutation_scale: 0.08
  full_elite_count: 2
  ga_crossover_rate: 0.5
  ga_mutation_rate: 0.1
  ga_early_stopping_generations: 0
  ga_invalid_candidate_penalty: 1000000.0
  ga_workers: 1
  frequency_band_hz: ""
  random_seed: 42
  bempp_tolerance: 1.0e-5
  bempp_max_iterations: 400
  solver_retry_policy: "retry_once"
  solver_warmup_enabled: false
  solver_failure_penalty: 1000000.0
  mesh_handoff_required: true
  mesh_handoff_validate_readability: true
